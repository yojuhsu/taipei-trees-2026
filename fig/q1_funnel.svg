<svg xmlns="http://www.w3.org/2000/svg" width="960" height="377" viewBox="0 0 960 377"><rect width="960" height="377" fill="#fffdf8"/><text x="32.0" y="44.0" font-family="'Noto Sans TC','PingFang TC',sans-serif" font-size="26" font-weight="900" fill="#1a1a1a" text-anchor="start">兩年內從行道樹名單消失的樹，</text><text x="32.0" y="78.0" font-family="'Noto Sans TC','PingFang TC',sans-serif" font-size="26" font-weight="900" fill="#1a1a1a" text-anchor="start">有 499 個位置可以先補</text><rect x="32" y="100" width="560.0" height="40" rx="4" fill="#c9c9c9"/><text x="44.0" y="127.0" font-family="'Noto Sans TC','PingFang TC',sans-serif" font-size="20" font-weight="900" fill="#1a1a1a" text-anchor="start">9,363 個樹籍</text><text x="616.0" y="117.0" font-family="'Noto Sans TC','PingFang TC',sans-serif" font-size="15" font-weight="700" fill="#1a1a1a" text-anchor="start">兩年內從行道樹名單消失</text><text x="616.0" y="135.0" font-family="'Noto Sans TC','PingFang TC',sans-serif" font-size="12" font-weight="400" fill="#666666" text-anchor="start">2024 年 11 月 21 日名單上有、2026 年 10 月 20 日</text><text x="616.0" y="150.0" font-family="'Noto Sans TC','PingFang TC',sans-serif" font-size="12" font-weight="400" fill="#666666" text-anchor="start">名單上找不到</text><text x="46.0" y="158.0" font-family="'Noto Sans TC','PingFang TC',sans-serif" font-size="14" font-weight="700" fill="#666666" text-anchor="start">↓</text><rect x="32" y="166" width="110.7" height="40" rx="4" fill="#666666"/><text x="150.7" y="193.0" font-family="'Noto Sans TC','PingFang TC',sans-serif" font-size="20" font-weight="900" fill="#1a1a1a" text-anchor="start">1,851 個位置</text><text x="616.0" y="183.0" font-family="'Noto Sans TC','PingFang TC',sans-serif" font-size="15" font-weight="700" fill="#1a1a1a" text-anchor="start">樹穴還在、人行道 2 公尺以上</text><text x="616.0" y="201.0" font-family="'Noto Sans TC','PingFang TC',sans-serif" font-size="12" font-weight="400" fill="#666666" text-anchor="start">原址 6 公尺內現在沒有任何樹，2 公尺內有樹穴，</text><text x="616.0" y="216.0" font-family="'Noto Sans TC','PingFang TC',sans-serif" font-size="12" font-weight="400" fill="#666666" text-anchor="start">人行道寬 2 公尺以上</text><text x="46.0" y="224.0" font-family="'Noto Sans TC','PingFang TC',sans-serif" font-size="14" font-weight="700" fill="#666666" text-anchor="start">↓</text><rect x="32" y="232" width="29.8" height="40" rx="4" fill="#C8102E"/><text x="69.8" y="259.0" font-family="'Noto Sans TC','PingFang TC',sans-serif" font-size="20" font-weight="900" fill="#C8102E" text-anchor="start">499 個</text><text x="616.0" y="249.0" font-family="'Noto Sans TC','PingFang TC',sans-serif" font-size="15" font-weight="700" fill="#C8102E" text-anchor="start">在樹蔭不夠的 102 個里</text><text x="616.0" y="267.0" font-family="'Noto Sans TC','PingFang TC',sans-serif" font-size="12" font-weight="400" fill="#666666" text-anchor="start">樹冠三成、300 公尺有公園兩項都沒做到的里</text><line x1="32" y1="302" x2="928" y2="302" stroke="#c9c9c9" stroke-dasharray="4 4"/><text x="32.0" y="319.0" font-family="'Noto Sans TC','PingFang TC',sans-serif" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="start">公園處一年移除 3,164 棵是另一本帳，跟這條漏斗不能相減（議員轉述公園處 2025 年統計，自由時報 2026 年 7 月 13 日）。</text><text x="32.0" y="338.0" font-family="'Noto Sans TC','PingFang TC',sans-serif" font-size="11" font-weight="400" fill="#666666" text-anchor="start">樹穴圖只蓋到 36% 的行道樹，所以 1,851 與 499 是下限。</text><text x="32.0" y="357.0" font-family="'Noto Sans TC','PingFang TC',sans-serif" font-size="11" font-weight="400" fill="#666666" text-anchor="start">資料：公園處行道樹分布圖（2024 年 11 月 21 日版取自 Internet Archive）、新工處樹穴圖與人行道範圍圖（2026 年 1 月 14 日更新）。</text></svg>